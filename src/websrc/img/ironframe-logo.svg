  <line x1="12" y1="32" x2="22" y2="32" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="32" x2="52" y2="32" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="12" x2="32" y2="22" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="42" x2="32" y2="52" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Corner traces -->
  <polyline points="14,20 14,14 20,14" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="44,14 50,14 50,20" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
