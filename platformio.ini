; Ironframe fork of esp-rfid for ESP32-S3 and the original ESP32.
; The upstream ESP8266 environments were removed: the code now uses the
; ESP32 Arduino core (LittleFS, FreeRTOS, WiFi events).

[platformio]
default_envs = esp32s3

[common]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  bblanchon/ArduinoJson@6.21.5
  ESP32Async/AsyncTCP@3.5.0
  ESP32Async/ESPAsyncWebServer@3.12.1
  bertmelis/espMqttClient@1.7.3
  thomasfredericks/Bounce2@2.72
lib_ignore =
  ESPAsyncTCP
  ESPAsyncTCP-esphome
  AsyncTCP_RP2040W
build_flags =
  -DCORE_DEBUG_LEVEL=0
  ; espMqttClient: no publish queued while disconnected (the code checks
  ; connected() first, as with AsyncMqttClient; a broker away for hours must
  ; not leave a backlog in RAM)
  -DEMC_ALLOW_NOT_CONNECTED_PUBLISH=0

; ESP32-S3 DevKitC-1 style boards (N8 / N16R8). Native USB CDC is used for the
; serial console so the board shows up as /dev/ttyACM* without a UART bridge.
[env:esp32s3]
platform = ${common.platform}
framework = ${common.framework}
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
lib_deps = ${common.lib_deps}
lib_ignore = ${common.lib_ignore}
build_flags = ${common.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_flags = -Wall -Wextra -Wno-unused-parameter -Wno-missing-field-initializers
extra_scripts = pre:scripts/version.py
  scripts/bins.py
custom_bin_name = esp32s3
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}

; Same board with serial debug output enabled.
[env:esp32s3-debug]
extends = env:esp32s3
build_flags = ${env:esp32s3.build_flags}
  -DDEBUG
custom_bin_name = esp32s3-debug

; Debug build with the console on UART0 instead of native USB, for boot tests
; in Espressif's QEMU (qemu-system-xtensa -machine esp32s3). See test/qemu/.
[env:esp32s3-qemu]
extends = env:esp32s3
build_flags = ${common.build_flags}
  -DDEBUG
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DQEMU_NO_WIFI
custom_bin_name = esp32s3-qemu

; Original ESP32 (WROOM-32/32E), e.g. the VOANZO / LC-Tech "ESP32 Relay x2"
; 2-relay board (relays GPIO16/17, LED GPIO23, BOOT button GPIO0). Console on
; UART0 via the board's 6-pin serial header. 4 MB flash: two 1.5 MB app slots
; for OTA, ~900 KB LittleFS and a core dump (partitions-esp32wroom.csv; 1.0
; used default.csv with 1.25 MB slots, and moving between them needs a serial
; flash that erases LittleFS and NVS).
[env:esp32wroom]
platform = ${common.platform}
framework = ${common.framework}
board = esp32dev
board_build.filesystem = littlefs
board_build.partitions = partitions-esp32wroom.csv
lib_deps = ${common.lib_deps}
lib_ignore = ${common.lib_ignore}
build_flags = ${common.build_flags}
build_src_flags = -Wall -Wextra -Wno-unused-parameter -Wno-missing-field-initializers
extra_scripts = pre:scripts/version.py
  scripts/bins.py
custom_bin_name = esp32wroom
monitor_speed = ${common.monitor_speed}
upload_speed = 460800

[env:esp32wroom-debug]
extends = env:esp32wroom
build_flags = ${common.build_flags}
  -DDEBUG
custom_bin_name = esp32wroom-debug

; Deliberately broken image for the OTA rollback test on the board: serves the
; UI for 20 s, then hangs loop(). The watchdog restarts it before the image is
; confirmed, and the bootloader boots the previous image. Never ship it.
[env:esp32wroom-rollbacktest]
extends = env:esp32wroom
build_flags = ${common.build_flags}
  -DIRONFRAME_ROLLBACK_TEST
custom_bin_name = esp32wroom-rollbacktest

; Boot test in QEMU (machine esp32), see test/qemu/boot-test.sh
[env:esp32wroom-qemu]
extends = env:esp32wroom
build_flags = ${common.build_flags}
  -DDEBUG
  -DQEMU_NO_WIFI
custom_bin_name = esp32wroom-qemu
